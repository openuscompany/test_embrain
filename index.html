<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>수협 웹진 (PDF 이북)</title>
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/pdf-reader.css?v=24">
</head>

<body class="pdf-reader">

  <div class="pr-wrapper">

    <nav class="pr-index-rail" id="pr-index-rail" aria-label="목차"></nav>

    <div class="pr-stage" id="pr-stage">
      <div class="pr-loading" id="pr-loading">
        <div class="pr-spinner"></div>
        <p>이북을 준비하고 있어요…</p>
      </div>
      <div class="pr-book" id="pr-book"></div>
    </div>

    <div class="pr-controls">
      <button type="button" class="pr-btn pr-btn--prev" id="pr-prev" aria-label="이전 페이지">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 4l-8 8 8 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

      <div class="pr-indicator" id="pr-indicator" aria-live="polite">
        <span class="pr-indicator__current">1</span>
        <span class="pr-indicator__sep">/</span>
        <span class="pr-indicator__total">1</span>
      </div>

      <button type="button" class="pr-btn pr-btn--next" id="pr-next" aria-label="다음 페이지">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4l8 8-8 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <p class="pr-hint" id="pr-hint">← 좌우로 넘겨보세요, 모서리를 드래그해도 돼요 →</p>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script>
  <script src="js/pdf-reader.js?v=24"></script>
</body>

</html>
